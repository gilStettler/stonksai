services:
  backend:
    container_name: stonksai-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./.env
    environment:
      # Backend API keys (your backend reads VT_API_KEYS; keep VT_API_KEY for convenience too)
      VT_API_KEYS: ${VT_API_KEYS:-vt_live_admin_123:admin}
      VT_API_KEY: ${VT_API_KEY:-vt_live_admin_123}

      # Ensure paths are container paths (override any local absolute paths from .env)
      JOBS_DIR: ${JOBS_DIR:-jobs}
      STOCK_CSV_DIR: ${STOCK_CSV_DIR:-jobs/data_csv}
      FORECAST_STORE_DIR: ${FORECAST_STORE_DIR:-jobs/data_out}
      LOCK_DIR: ${LOCK_DIR:-.locks}
      PYTHON_BIN: ${PYTHON_BIN:-/usr/local/bin/python}

      # Optional
      ENABLE_JOB_TRIGGERS: ${ENABLE_JOB_TRIGGERS:-1}
      JOB_TRIGGER_TOKEN: ${JOB_TRIGGER_TOKEN:-}
      ENV: ${ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Persist + share data between host and container
      - ./jobs:/app/jobs
      - ./.locks:/app/.locks
    ports:
      - "8000:8000"
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()\""]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    container_name: stonksai-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - ./.env
    environment:
      # IMPORTANT: Frontend must NOT use localhost inside Docker.
      # Use service name "backend" on the compose network.
      API_BASE_URL: ${API_BASE_URL:-http://backend:8000}
      VT_BACKEND_URL: ${VT_BACKEND_URL:-http://backend:8000}

      # Frontend token (use admin key by default)
      VT_API_KEY: ${VT_API_KEY:-vt_live_admin_123}

      # Streamlit settings
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0"]

networks:
  default:
    name: stonksai_default
